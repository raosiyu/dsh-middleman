# dsh-middleman bundle 层：一行宿主半区，一行浏览器半区。
#
# 宿主行拥有台账、/dsh-middleman/api 路由、派发与回传；浏览器行只注册
# 侧边栏一行与中台页。两行 id 都在本包命名空间内，不与任何共享 id 冲突。
- insert:
    - id: dsh-middleman
      name: 'dsh-middleman'
      config:
        enabled: true
        announceToAgent: true
    - id: dsh-middleman-client
      name: 'dsh-middleman/client'
      config: {}
